<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Insulina</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card{
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      font-size: 22px;
      text-align: center;
    }

    label{
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input{
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button{
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover{
      background: #45a049;
    }

    .resultado{
      margin-top: 20px;
      background: #eee;
      padding: 15px;
      border-radius: 8px;
    }

    .aviso{
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Calculadora de Insulina</h1>

    <label>Glicemia Atual</label>
    <input type="number" id="glicemia" placeholder="Ex: 220">

    <label>Carboidratos da Refeição (g)</label>
    <input type="number" id="carbo" placeholder="Ex: 60">

    <label>Meta de Glicemia</label>
    <input type="number" id="meta" placeholder="Ex: 120">

    <label>Fator de Correção</label>
    <input type="number" id="fator" placeholder="Ex: 50">

    <label>Relação Insulina/Carbo</label>
    <input type="number" id="relacao" placeholder="Ex: 10">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado">
      Resultado aparecerá aqui
    </div>

    <div class="aviso">
      Ferramenta de apoio. Não substitui orientação médica.
    </div>

  </div>

  <script>

    function calcular(){

      let glicemia = Number(document.getElementById("glicemia").value);
      let carbo = Number(document.getElementById("carbo").value);
      let meta = Number(document.getElementById("meta").value);
      let fator = Number(document.getElementById("fator").value);
      let relacao = Number(document.getElementById("relacao").value);

      let correcao = (glicemia - meta) / fator;

      if(correcao < 0){
        correcao = 0;
      }

      let comida = carbo / relacao;

      let total = correcao + comida;

      document.getElementById("resultado").innerHTML = `
        <p><strong>Correção:</strong> ${correcao.toFixed(1)} U</p>
        <p><strong>Refeição:</strong> ${comida.toFixed(1)} U</p>
        <hr>
        <p><strong>Total:</strong> ${total.toFixed(1)} U</p>
      `;
    }

  </script>

</body>
</html>
