<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Diário</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <header>
      <h1>🍓 Controle Diário</h1>
      <p>Escolha uma refeição</p>
    </header>

    <!-- MENU -->
    <div class="menu">
      <button onclick="abrir('cafe')">☀️ Café</button>
      <button onclick="abrir('almoco')">🍛 Almoço</button>
      <button onclick="abrir('lanche')">☕ Lanche</button>
      <button onclick="abrir('janta')">🌙 Janta</button>
    </div>

    <!-- TELA REFEIÇÃO -->
    <div id="tela" class="hidden">

      <h2 id="titulo"></h2>

      <div id="lista"></div>

      <div class="card">
        <h3>Total carboidratos</h3>
        <p><span id="total">0</span> g</p>
      </div>

      <div class="glicemia">
        <label>Glicemia atual</label>
        <input id="glicemia" type="range" min="40" max="350" value="120">
        <p id="valorGlicemia">120 mg/dL</p>
      </div>

      <button onclick="salvar()">Salvar registro</button>

    </div>

    <!-- HISTÓRICO -->
    <div class="historico">
      <h2>Histórico</h2>
      <div id="listaHistorico"></div>
    </div>

  </div>

  <script> const dados = {
  cafe: [
    { nome: "Pão francês", carbo: 28 },
    { nome: "Queijo", carbo: 1 },
    { nome: "Banana", carbo: 20 }
  ],
  almoco: [
    { nome: "Arroz", carbo: 28 },
    { nome: "Feijão", carbo: 14 },
    { nome: "Frango", carbo: 0 }
  ],
  lanche: [
    { nome: "Iogurte", carbo: 12 },
    { nome: "Maçã", carbo: 15 }
  ],
  janta: [
    { nome: "Sopa", carbo: 18 },
    { nome: "Pão", carbo: 28 }
  ]
};

let atual = "";
let selecionados = [];

// CONFIG (você ajusta com a médica)
const config = {
  metaGlicemia: 100
};

function abrir(tipo) {
  atual = tipo;
  selecionados = [];

  document.getElementById("tela").classList.remove("hidden");
  document.getElementById("titulo").innerText = tipo.toUpperCase();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  dados[tipo].forEach((item, i) => {
    lista.innerHTML += `
      <label>
        <input type="checkbox" onchange="toggle(${i})">
        <span>${item.nome}</span>
        <span>${item.carbo}g</span>
      </label>
    `;
  });

  calcular();
}

function toggle(i) {
  const item = dados[atual][i];

  if (selecionados.includes(item)) {
    selecionados = selecionados.filter(x => x !== item);
  } else {
    selecionados.push(item);
  }

  calcular();
}

function calcular() {
  let totalCarbo = 0;

  selecionados.forEach(i => totalCarbo += i.carbo);

  document.getElementById("total").innerText = totalCarbo;

  atualizarResumo();
}

function atualizarResumo() {
  const glic = Number(document.getElementById("glicemia").value);

  const diff = glic - config.metaGlicemia;

  const status =
    diff === 0 ? "Na meta"
    : diff > 0 ? "Acima da meta"
    : "Abaixo da meta";

  if (!document.getElementById("resumo")) {
    const div = document.createElement("div");
    div.id = "resumo";
    div.className = "card";
    document.querySelector(".card").after(div);
  }

  document.getElementById("resumo").innerHTML = `
    <h3>Resumo</h3>
    <p>🎯 Meta: ${config.metaGlicemia} mg/dL</p>
    <p>📊 Atual: ${glic} mg/dL</p>
    <p>📈 Diferença: ${diff} mg/dL</p>
    <p>🧠 Status: ${status}</p>
    <p>🍞 Carboidratos: ${document.getElementById("total").innerText} g</p>
  `;
}

document.getElementById("glicemia").oninput = (e) => {
  document.getElementById("valorGlicemia").innerText =
    e.target.value + " mg/dL";

  atualizarResumo();
};

function salvar() {
  const registro = {
    data: new Date().toLocaleString(),
    refeicao: atual,
    carbo: document.getElementById("total").innerText,
    glicemia: document.getElementById("glicemia").value,
    meta: config.metaGlicemia
  };

  let hist = JSON.parse(localStorage.getItem("hist")) || [];
  hist.unshift(registro);

  localStorage.setItem("hist", JSON.stringify(hist));

  carregar();
}

function carregar() {
  const lista = document.getElementById("listaHistorico");
  let hist = JSON.parse(localStorage.getItem("hist")) || [];

  lista.innerHTML = "";

  hist.forEach(h => {
    const diff = h.glicemia - h.meta;

    lista.innerHTML += `
      <div class="item">
        <b>${h.refeicao}</b><br>
        🍞 ${h.carbo}g<br>
        📊 ${h.glicemia} mg/dL<br>
        🎯 meta ${h.meta} mg/dL<br>
        📈 ${diff > 0 ? "+" + diff : diff} mg/dL<br>
        <small>${h.data}</small>
      </div>
    `;
  });
}

carregar();

  </script>
</body>

</html>
